<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornal do Colégio Francisco Neves Filho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#f7eedc;--branco:#fffaf0;--azul:#7c0a28;--azul-esc:#4c0417;--creme:#f6ead0;--texto:#2a160f;--cinza:#8a6f5e;--linha:#e3d3b4}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:"Nunito",system-ui,Arial,sans-serif;line-height:1.6}
h1,h2,h3,.secao,.aba,.novo,.ic,.chip,.dia b,.etq,.marca p,.sub .int,button,.data{font-family:"Fredoka","Baloo 2",system-ui,sans-serif}
.topo{background:var(--azul);border-bottom:6px solid var(--azul-esc)}
.topo-int{max-width:1100px;margin:0 auto;padding:18px 20px;position:relative;display:flex;align-items:center;justify-content:center;gap:22px;text-align:left;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:18px}
.logo{flex:none;height:112px;width:auto;display:block}
.marca h1{margin:0;font-size:clamp(1.4rem,4.2vw,2.3rem);line-height:1.1;font-weight:700;letter-spacing:.3px;color:var(--creme)}
.marca p.contato{margin:6px 0 0;font-size:.72rem;font-weight:600;letter-spacing:.2px;text-transform:none;opacity:.9}
.contato a{color:var(--creme);text-decoration:none;border-bottom:1px dotted var(--creme)}
.contato a:hover{color:#fff;border-bottom-style:solid}
.marca p{margin:5px 0 0;font-size:.82rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--creme);opacity:.85}
.icones{position:absolute;top:16px;right:20px;display:flex;gap:8px;align-items:center}
.ic{width:38px;height:38px;border-radius:50%;border:2px solid var(--creme);background:var(--azul-esc);color:var(--creme);display:grid;place-items:center;cursor:pointer;padding:0}
.ic:hover{background:var(--creme);color:var(--azul-esc)}
.ic svg{width:18px;height:18px}
.novo{border:0;background:var(--creme);color:var(--azul-esc);font:700 .85rem/1 "Fredoka",sans-serif;letter-spacing:.3px;padding:0 18px;height:38px;border-radius:20px;cursor:pointer}
.novo:hover{background:#fff}
.sub{background:var(--azul-esc)}
.sub .int{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--creme);letter-spacing:.5px;text-transform:uppercase}
.abas{display:flex;gap:2px}
.aba{font:700 .88rem/1 "Fredoka",sans-serif;letter-spacing:.3px;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;cursor:pointer;color:var(--creme);opacity:.7}
.aba:hover{opacity:1}
.aba[aria-current="page"]{border-bottom-color:var(--creme);opacity:1}
main{max-width:1100px;margin:0 auto;padding:28px 20px}
.secao{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:1.15rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--azul)}
.secao::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--azul)}
.secao::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--linha)}
.layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
#colCrono{position:sticky;top:20px;background:var(--branco);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(42,22,15,.08)}
#colCrono .cab{border-top:0;padding-top:0;margin-bottom:14px}
#colCrono .evento{box-shadow:none;padding:12px 0;border-bottom:1px solid var(--linha);border-radius:0}
#colCrono .evento:last-child{border-bottom:0}
.abertura{display:flex;flex-direction:column;gap:20px;margin-bottom:36px}
.hero{background:var(--branco);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(42,22,15,.08)}
.hero .midia{aspect-ratio:21/9}
.hero .corpo{padding:18px 22px 22px}
.hero h2{font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.2;font-weight:700;letter-spacing:-.3px;font-family:"Fredoka",sans-serif}
.lateral{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.item{background:var(--branco);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 10px rgba(42,22,15,.08)}
.item .midia{width:86px;height:86px;flex:none;border-radius:12px}
.item h2{font-size:1rem;line-height:1.3;font-weight:700;font-family:"Fredoka",sans-serif}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--branco);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(42,22,15,.08)}
.card .midia{aspect-ratio:16/10}
.card .corpo{padding:14px 16px 18px}
.card h2{font-size:1.1rem;line-height:1.25;font-weight:700;font-family:"Fredoka",sans-serif}
.midia{background:var(--fundo);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--azul);font-weight:700;font-size:1.5rem;font-family:"Fredoka",sans-serif;opacity:1;border:0;padding:0;width:100%}
.midia img{width:100%;height:100%;object-fit:cover;display:block}
.corpo h2,.item h2{margin:0}
.titulo{all:unset;cursor:pointer;display:block;font:inherit;font-weight:inherit}
.titulo:hover{color:var(--azul)}
.hero h2,.item h2,.card h2{font-weight:700}
.titulo:focus-visible,.midia:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.aba:focus-visible,.chip:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.data{font-size:.72rem;color:var(--cinza);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.resumo{color:#4a3a2e;margin:8px 0 0;font-size:.97rem;font-family:"Nunito",sans-serif}
.acoes{display:flex;gap:8px;margin-top:10px}
.acoes button,.linha-bt button{font:700 .82rem/1 "Fredoka",sans-serif;border:2px solid var(--azul);background:var(--branco);color:var(--azul);padding:6px 16px;border-radius:16px;cursor:pointer}
.acoes button:hover,.linha-bt button:hover{background:var(--azul);color:var(--branco)}
.linha-bt .principal{background:var(--azul);color:var(--creme);border-color:var(--azul)}
.linha-bt .principal:hover{background:var(--azul-esc);border-color:var(--azul-esc)}
.vazio{text-align:center;padding:60px 0;color:var(--cinza);font-weight:600}
footer{background:var(--azul-esc);color:var(--creme);margin-top:20px}
footer div{max-width:1100px;margin:0 auto;padding:22px 20px;font-size:.85rem;text-align:center;font-family:"Nunito",sans-serif}
footer b{font-family:"Fredoka",sans-serif;letter-spacing:.3px;text-transform:uppercase;color:var(--creme)}
.credito{font:inherit;font-weight:700;background:none;border:0;border-bottom:2px dashed var(--creme);color:var(--creme);cursor:pointer;padding:0}
.credito:hover{color:#fff;border-bottom-color:#fff}
.assin{margin:10px 0 0;font-style:italic;font-weight:700;color:var(--cinza);font-size:.9rem}
#listaAlunos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
.aluno{text-align:center}
.aluno .foto{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--fundo);display:grid;place-items:center;margin:0 auto 6px;color:var(--azul);font:700 1.6rem "Fredoka",sans-serif}
.aluno p{margin:0;font-weight:700;font-size:.9rem}
dialog{border:0;border-radius:20px;background:var(--branco);color:var(--texto);padding:26px;width:min(560px,92vw);max-height:90vh;font-family:"Nunito",sans-serif}
dialog::backdrop{background:rgba(42,22,15,.55)}
dialog h3{margin:0 0 12px;font-size:1.3rem;font-weight:700;font-family:"Fredoka",sans-serif;border-bottom:2px solid var(--linha);padding-bottom:10px}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza)}
input,textarea,select{width:100%;font:1rem "Nunito",sans-serif;padding:9px 12px;border:2px solid var(--linha);border-radius:10px;background:#fff;color:#000}
textarea{min-height:140px;resize:vertical}
.linha-bt{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.erro{color:#a40000;min-height:1.4em;margin:8px 0 0;font-size:.88rem;font-weight:700}
#previa{margin-top:8px;max-height:130px;display:none;border-radius:10px}
#leitura img{width:100%;margin-bottom:14px;border-radius:14px}
#leitura h3{font-size:1.6rem;font-weight:700;font-family:"Fredoka",sans-serif;line-height:1.2;margin:4px 0 10px}
#leitura .txt{white-space:pre-line}
[hidden]{display:none!important}
.bt-aviso{font:700 .8rem "Fredoka",sans-serif;margin:4px 0 0 8px;padding:5px 12px;border-radius:14px;border:2px solid #4a3600;background:#fff;color:#4a3600;cursor:pointer}
.bt-aviso:hover{background:#4a3600;color:#fff}
.aviso{background:#fff1c2;color:#4a3600;text-align:center;font-weight:700;font-size:.88rem;padding:10px 20px}
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--linha)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 .8rem/1 "Fredoka",sans-serif;letter-spacing:.2px;background:var(--branco);color:var(--azul);border:2px solid var(--azul);border-radius:18px;padding:6px 14px;cursor:pointer}
.chip:hover{background:var(--fundo)}
.chip.on{background:var(--azul);color:var(--creme);border-color:var(--azul)}
.busca{flex:1 1 220px;max-width:300px;width:auto;margin-left:auto;border-radius:18px;font-family:"Nunito",sans-serif}
.etq{display:inline-block;background:var(--azul);color:var(--creme);font-size:.68rem;font-weight:700;font-family:"Fredoka",sans-serif;padding:2px 10px;border-radius:8px;margin-right:10px;text-transform:uppercase;letter-spacing:.4px}
.cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.cab .secao{margin:0}
.evento{display:flex;gap:16px;background:var(--branco);border-radius:16px;padding:14px 18px;margin-bottom:12px;align-items:flex-start;box-shadow:0 2px 10px rgba(42,22,15,.08)}
.dia{flex:none;width:62px;text-align:center;background:var(--fundo);border-radius:12px;padding:6px 0;line-height:1.1}
.dia b{display:block;font-size:1.6rem;font-weight:700;font-family:"Fredoka",sans-serif;color:var(--azul)}
.dia span{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza)}
.evento h2{margin:0;font-size:1.1rem;font-weight:700;font-family:"Fredoka",sans-serif}
.evento p{margin:3px 0 0;color:#4a3a2e;font-size:.92rem;font-family:"Nunito",sans-serif}
.evento p.hora{color:var(--cinza);font-size:.78rem;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.passado{opacity:.5}
@media(max-width:900px){.layout{grid-template-columns:1fr}#colCrono{position:static}}
@media(max-width:800px){.topo-int{justify-content:center;text-align:center}.marca{flex-direction:column}.icones{position:static;margin-top:14px;justify-content:center}}
</style>
</head>

<script src="noticias.js"></script>
<script type="module">
// ===================== CONFIGURAÇÃO (preencha só estas 2 linhas) =====================
const SUPABASE_URL = "COLE_AQUI_A_URL_DO_PROJETO";
const SUPABASE_KEY = "COLE_AQUI_A_CHAVE_PUBLISHABLE";
// ======================================================================================

const DOMINIO = "@jornalfnf.com";            // os usuários são criados no Supabase com este final
const USER_POSTS = "3a2026", USER_CRO = "3a2026c";

// Para adicionar alunos, preencha a lista abaixo. Exemplo:
// const ALUNOS = [{nome:"Maria Silva", foto:"fotos/maria.jpg"}, {nome:"João Souza", foto:""}];
const ALUNOS = [];

const CATS = ["Geral","Avisos","Eventos","Esportes","Cultura","Conquistas"];
let noticias = [], eventos = [], logado = false, logadoCrono = false;
let editandoId = null, editandoEv = null, imagemAtual = "", imagemBlob = null;
let filtroCat = "Todas", busca = "", erroCarga = false;
const $ = id => document.getElementById(id);

const SVG_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
const SVG_SAIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>';

// ---------- conexão com o Supabase ----------
let sb = null;
const configurado = /^https:\/\//.test(SUPABASE_URL) && !/^COLE/.test(SUPABASE_KEY);
// Sem banco de dados: as notícias vêm do arquivo noticias.js
const modoArquivo = !configurado && Array.isArray(window.NOTICIAS);
// Modo editor: aparece só quando você abre o arquivo direto do computador. Na internet (GitHub) o site é só de leitura.
const modoEditor = modoArquivo && location.protocol === "file:";
const CHAVE_ED = "jornal_fnf_edicao_v1";
if(configurado){
  try{
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb = createClient(SUPABASE_URL, SUPABASE_KEY);
  }catch(e){ console.error(e); }
}
function mostrarAviso(){
  if(modoEditor){
    const av = $("aviso");
    av.textContent = "Modo editor (só neste computador): o que você postar fica salvo aqui. Depois clique em Baixar noticias.js e envie esse arquivo para o GitHub. ";
    const b1 = document.createElement("button"); b1.type="button"; b1.className="bt-aviso"; b1.textContent="Baixar noticias.js"; b1.onclick=baixarNoticiasJs;
    const b2 = document.createElement("button"); b2.type="button"; b2.className="bt-aviso"; b2.textContent="Recomeçar do noticias.js"; b2.onclick=recomecarEdicao;
    av.append(b1,b2); av.hidden = false;
    return;
  }
  if(modoArquivo) return;
  const av = $("aviso");
  if(!configurado) av.textContent = "Modo demonstração: o site ainda não está conectado ao banco de dados. As notícias e os eventos abaixo são só exemplos.";
  else if(!sb) av.textContent = "Não foi possível carregar o serviço de dados. Verifique a internet e recarregue a página.";
  else return;
  av.hidden = false;
}

// ---------- dados ----------
function diaISO(dias){
  const d = new Date(); d.setDate(d.getDate()+dias);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dadosExemplo(){
  const agora = Date.now(), dia = 86400000;
  noticias = [
    {id:1,titulo:"Bem-vindos ao jornal do Colégio Francisco Neves Filho",texto:"A Turma 3°A inaugura o jornal escolar. Aqui vamos publicar as novidades do colégio, eventos, conquistas dos alunos e avisos importantes.\n\nAcompanhe as edições e fique por dentro de tudo o que acontece na escola.",imagem:"",categoria:"Geral",autor:"Turma 3°A",data:new Date(agora).toISOString()},
    {id:2,titulo:"Turma 3°A assume a produção das notícias",texto:"Os alunos do 3°A ficaram responsáveis por escrever, revisar e publicar as matérias deste site. A ideia é treinar leitura, escrita e trabalho em equipe.",imagem:"",categoria:"Geral",autor:"Turma 3°A",data:new Date(agora-dia).toISOString()},
    {id:3,titulo:"Sugestões de pauta são bem-vindas",texto:"Tem uma novidade, projeto ou evento que merece virar notícia? Fale com os alunos do 3°A e sua pauta pode ser a próxima matéria.",imagem:"",categoria:"Avisos",autor:"Turma 3°A",data:new Date(agora-2*dia).toISOString()}
  ];
  eventos = [
    {id:1,data:diaISO(7),hora:"19:00",titulo:"Reunião de pais e mestres (exemplo)",desc:"Evento de demonstração."},
    {id:2,data:diaISO(14),hora:"08:00",titulo:"Feira de ciências (exemplo)",desc:"Apresentação dos projetos das turmas."},
    {id:3,data:diaISO(30),hora:"",titulo:"Entrega das notas do bimestre (exemplo)",desc:""}
  ];
}
function carregarDoArquivo(){
  // "2026-11-12" vira meio-dia local, para não aparecer um dia antes
  const dia = x => /^\d{4}-\d{2}-\d{2}$/.test(x||"") ? x+"T12:00:00" : (x || new Date().toISOString());
  noticias = window.NOTICIAS.map((n,i)=>({id:i+1, titulo:n.titulo||"", texto:n.texto||"", categoria:n.categoria||"Geral", autor:n.autor||"Turma 3°A", imagem:n.imagem||"", data:dia(n.data)}));
  noticias.sort((a,b)=>new Date(b.data)-new Date(a.data));
  eventos = (Array.isArray(window.EVENTOS) ? window.EVENTOS : []).map((e,i)=>({id:i+1, data:e.data, hora:e.hora||"", titulo:e.titulo||"", desc:e.desc||""}));
}
function lerEdicao(){ try{ return JSON.parse(localStorage.getItem(CHAVE_ED)); }catch(e){ return null; } }
function salvarEdicao(){
  try{ localStorage.setItem(CHAVE_ED, JSON.stringify({noticias, eventos})); return true; }
  catch(e){ alert("Não foi possível salvar neste computador (as fotos podem estar ocupando muito espaço). Clique em Baixar noticias.js para não perder o que já fez."); return false; }
}
function blobParaDataURL(blob){
  return new Promise((ok, erro)=>{ const l = new FileReader(); l.onload = ()=>ok(l.result); l.onerror = ()=>erro(l.error); l.readAsDataURL(blob); });
}
function baixarNoticiasJs(){
  const ns = noticias.map(n=>({titulo:n.titulo, categoria:n.categoria||"Geral", autor:n.autor||"Turma 3°A", data:n.data, imagem:n.imagem||"", texto:n.texto}));
  const es = [...eventos].sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||""))).map(e=>({data:e.data, hora:e.hora||"", titulo:e.titulo, desc:e.desc||""}));
  const txt = "// Gerado pelo modo editor do jornal.\n// Envie este arquivo para o GitHub no lugar do noticias.js antigo.\n\n"
    + "window.NOTICIAS = " + JSON.stringify(ns, null, 2) + ";\n\nwindow.EVENTOS = " + JSON.stringify(es, null, 2) + ";\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"text/javascript"}));
  a.download = "noticias.js";
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
async function recomecarEdicao(){
  if(!confirm("Isso apaga o que foi postado neste computador e volta ao que está no arquivo noticias.js. Continuar?")) return;
  try{ localStorage.removeItem(CHAVE_ED); }catch(e){}
  await recarregar();
}
async function carregarDados(){
  if(modoEditor){
    const ed = lerEdicao();
    if(ed && Array.isArray(ed.noticias)){ noticias = ed.noticias; eventos = Array.isArray(ed.eventos) ? ed.eventos : []; }
    else carregarDoArquivo();
    return;
  }
  if(modoArquivo){ carregarDoArquivo(); return; }
  if(!sb){ dadosExemplo(); return; }
  const [n, e] = await Promise.all([
    sb.from("noticias").select("*").order("data",{ascending:false}),
    sb.from("eventos").select("*").order("data",{ascending:true})
  ]);
  if(n.error) throw n.error;
  if(e.error) throw e.error;
  noticias = n.data.map(r=>({...r, categoria:r.categoria||"Geral", autor:r.autor||"Turma 3°A", imagem:r.imagem||""}));
  eventos = e.data.map(r=>({id:r.id, data:r.data, hora:r.hora||"", titulo:r.titulo, desc:r.descricao||""}));
}
async function recarregar(){
  try{ await carregarDados(); erroCarga = false; }
  catch(err){ console.error(err); erroCarga = true; noticias = []; eventos = []; }
  desenhar();
}
function aplicarSessao(session){
  const email = (session && session.user && session.user.email || "").toLowerCase();
  logado = email === USER_POSTS + DOMINIO;
  logadoCrono = email === USER_CRO + DOMINIO;
}

// ---------- visual ----------
function etiqueta(c){ const s = document.createElement("span"); s.className="etq"; s.textContent=c||"Geral"; return s; }
function formatar(iso){
  return new Date(iso).toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
}
function midia(n){
  const b = document.createElement("button"); b.type="button"; b.className="midia";
  b.setAttribute("aria-label","Ler: "+n.titulo);
  if(n.imagem){ const i = document.createElement("img"); i.src=n.imagem; i.alt=""; i.loading="lazy"; b.append(i); }
  else b.textContent = "FN";
  b.onclick = ()=>abrirLeitura(n);
  return b;
}
function bloco(n, classe, comResumo){
  const a = document.createElement("article"); a.className = classe;
  a.append(midia(n));
  const c = document.createElement("div"); c.className = "corpo";
  const d = document.createElement("p"); d.className="data"; d.append(etiqueta(n.categoria), formatar(n.data));
  const h = document.createElement("h2");
  const t = document.createElement("button"); t.type="button"; t.className="titulo"; t.textContent=n.titulo; t.onclick=()=>abrirLeitura(n);
  h.append(t); c.append(d,h);
  if(comResumo){
    const r = document.createElement("p"); r.className="resumo";
    r.textContent = n.texto.length>150 ? n.texto.slice(0,150).trim()+"…" : n.texto; c.append(r);
    const as = document.createElement("p"); as.className="assin"; as.textContent = "— "+(n.autor||"Turma 3°A"); c.append(as);
  }
  if(logado){
    const ac = document.createElement("div"); ac.className="acoes";
    const be = document.createElement("button"); be.textContent="Editar"; be.onclick=()=>abrirEditor(n.id);
    const bx = document.createElement("button"); bx.textContent="Excluir"; bx.onclick=()=>excluir(n.id);
    ac.append(be,bx); c.append(ac);
  }
  a.append(c);
  return a;
}
function desenhar(){
  const box = $("noticias"); box.innerHTML = "";
  const q = busca.toLowerCase();
  const lista = noticias.filter(n => (filtroCat==="Todas" || n.categoria===filtroCat) && (!q || (n.titulo+" "+n.texto).toLowerCase().includes(q)));
  if(!lista.length){
    const v = document.createElement("p"); v.className="vazio";
    v.textContent = erroCarga ? "Não foi possível carregar as notícias agora. Verifique a internet e recarregue a página."
      : noticias.length ? "Nenhuma notícia encontrada com esses filtros." : "Nenhuma notícia publicada ainda.";
    box.append(v);
  }else{
    const [primeira, ...resto] = lista;
    const lateral = resto.slice(0,3), demais = resto.slice(3);
    const sec = document.createElement("h2"); sec.className="secao"; sec.textContent="Últimas notícias"; box.append(sec);
    const ab = document.createElement("section"); ab.className="abertura";
    ab.append(bloco(primeira,"hero",true));
    if(lateral.length){
      const l = document.createElement("div"); l.className="lateral";
      lateral.forEach(n=>l.append(bloco(n,"item",false))); ab.append(l);
    }
    box.append(ab);
    if(demais.length){
      const s2 = document.createElement("h2"); s2.className="secao"; s2.textContent="Mais notícias"; box.append(s2);
      const g = document.createElement("section"); g.className="grade";
      demais.forEach(n=>g.append(bloco(n,"card",true))); box.append(g);
    }
  }
  const barra = $("barra"); barra.innerHTML = "";
  if(logado || logadoCrono){
    const bs = document.createElement("button"); bs.className="ic"; bs.innerHTML=SVG_SAIR; bs.title="Sair"; bs.setAttribute("aria-label","Sair");
    bs.onclick=async()=>{ try{ if(sb) await sb.auth.signOut(); }catch(e){} logado=false; logadoCrono=false; desenhar(); };
    if(logado){
      const bn = document.createElement("button"); bn.className="novo"; bn.textContent="+ Nova notícia"; bn.onclick=()=>abrirEditor(null);
      barra.append(bn);
    }
    if(!modoEditor) barra.append(bs);
  }else if(!modoArquivo){
    const b = document.createElement("button"); b.className="ic"; b.innerHTML=SVG_USER; b.title="Entrar"; b.setAttribute("aria-label","Entrar");
    b.onclick=()=>{$("erroLogin").textContent="";$("fLogin").reset();$("dlLogin").showModal();};
    barra.append(b);
  }
  desenharCrono();
}
function montarChips(){
  const box = $("chips"); box.innerHTML = "";
  ["Todas",...CATS].forEach(c=>{
    const b = document.createElement("button"); b.type="button"; b.className="chip"+(c===filtroCat?" on":""); b.textContent=c;
    b.onclick = ()=>{ filtroCat=c; montarChips(); desenhar(); };
    box.append(b);
  });
}
function desenharCrono(){
  const box = $("cronograma"); box.innerHTML = "";
  const bt = $("barraCro"); bt.innerHTML = "";
  if(logadoCrono){
    const b = document.createElement("button"); b.className="novo"; b.textContent="+ Evento"; b.onclick=()=>abrirEv(null);
    bt.append(b);
  }
  if(!eventos.length){
    const v = document.createElement("p"); v.className="vazio"; v.textContent="Nenhum evento no cronograma."; box.append(v); return;
  }
  const hoje = diaISO(0);
  [...eventos].sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||""))).forEach(e=>{
    const [y,m,d] = e.data.split("-").map(Number), dt = new Date(y,m-1,d), passou = e.data < hoje;
    const el = document.createElement("article"); el.className = "evento"+(passou?" passado":"");
    const dia = document.createElement("div"); dia.className="dia";
    const nb = document.createElement("b"); nb.textContent = d;
    const ms = document.createElement("span"); ms.textContent = dt.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    dia.append(nb,ms);
    const c = document.createElement("div");
    const h = document.createElement("h2"); h.textContent = e.titulo;
    const hr = document.createElement("p"); hr.className="hora";
    hr.textContent = dt.toLocaleDateString("pt-BR",{weekday:"long"}) + (e.hora ? ", às "+e.hora.slice(0,5) : "") + (passou ? " (já aconteceu)" : "");
    c.append(h,hr);
    if(e.desc){ const p = document.createElement("p"); p.textContent = e.desc; c.append(p); }
    if(logadoCrono){
      const ac = document.createElement("div"); ac.className="acoes";
      const be = document.createElement("button"); be.textContent="Editar"; be.onclick=()=>abrirEv(e.id);
      const bx = document.createElement("button"); bx.textContent="Excluir"; bx.onclick=()=>excluirEv(e.id);
      ac.append(be,bx); c.append(ac);
    }
    el.append(dia,c); box.append(el);
  });
}

// ---------- janelas ----------
function abrirEv(id){
  editandoEv = id; $("fEvento").reset();
  if(id){
    const e = eventos.find(x=>x.id===id);
    $("tituloEv").textContent="Editar evento";
    $("evData").value=e.data; $("evHora").value=(e.hora||"").slice(0,5); $("evTitulo").value=e.titulo; $("evDesc").value=e.desc||"";
  }else{ $("tituloEv").textContent="Novo evento"; }
  $("dlEvento").showModal();
}
function abrirLeitura(n){
  const box = $("leitura"); box.innerHTML = "";
  if(n.imagem){ const i = document.createElement("img"); i.src=n.imagem; i.alt=""; box.append(i); }
  const d = document.createElement("p"); d.className="data"; d.append(etiqueta(n.categoria), formatar(n.data));
  const h = document.createElement("h3"); h.textContent=n.titulo;
  const t = document.createElement("p"); t.className="txt"; t.textContent=n.texto;
  const a = document.createElement("p"); a.className="assin"; a.textContent = "— "+(n.autor||"Turma 3°A");
  box.append(d,h,t,a);
  $("dlLeitura").showModal();
}
function abrirEditor(id){
  editandoId = id; imagemAtual = ""; imagemBlob = null;
  $("fNoticia").reset(); $("previa").style.display="none";
  if(id){
    const n = noticias.find(x=>x.id===id);
    $("tituloForm").textContent="Editar notícia";
    $("titulo").value=n.titulo; $("categoria").value=n.categoria||"Geral"; $("texto").value=n.texto; $("assinatura").value=n.autor||""; imagemAtual=n.imagem||"";
    if(imagemAtual){ $("previa").src=imagemAtual; $("previa").style.display="block"; }
  }else{ $("tituloForm").textContent="Nova notícia"; }
  $("dlNoticia").showModal();
}

// ---------- gravar / excluir (só funcionam logado: o banco confere a permissão) ----------
async function comBotao(e, fn){
  e.preventDefault();
  const btn = e.submitter || e.target.querySelector(".principal");
  const txt = btn.textContent; btn.disabled = true; btn.textContent = "Salvando…";
  try{ await fn(); }
  catch(err){ alert("Não foi possível salvar: "+(err.message||err)); }
  finally{ btn.disabled = false; btn.textContent = txt; }
}
function exigirBanco(){ if(!sb) throw new Error("o site não está conectado ao banco de dados."); }
async function enviarImagem(blob){
  const nome = Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
  const up = await sb.storage.from("imagens").upload(nome, blob, {contentType:"image/jpeg"});
  if(up.error) throw up.error;
  return sb.storage.from("imagens").getPublicUrl(nome).data.publicUrl;
}
async function excluir(id){
  if(!confirm("Excluir esta notícia?")) return;
  if(modoEditor){ noticias = noticias.filter(n=>n.id!==id); salvarEdicao(); desenhar(); return; }
  try{
    exigirBanco();
    const r = await sb.from("noticias").delete().eq("id",id).select();
    if(r.error) throw r.error;
    if(!r.data.length) throw new Error("sem permissão. Entre novamente.");
    await recarregar();
  }catch(err){ alert("Não foi possível excluir: "+(err.message||err)); }
}
async function excluirEv(id){
  if(!confirm("Excluir este evento?")) return;
  if(modoEditor){ eventos = eventos.filter(e=>e.id!==id); salvarEdicao(); desenhar(); return; }
  try{
    exigirBanco();
    const r = await sb.from("eventos").delete().eq("id",id).select();
    if(r.error) throw r.error;
    if(!r.data.length) throw new Error("sem permissão. Entre novamente.");
    await recarregar();
  }catch(err){ alert("Não foi possível excluir: "+(err.message||err)); }
}
// reduz a foto antes de enviar (mais rápido e economiza espaço)
function reduzir(arquivo, cb){
  const url = URL.createObjectURL(arquivo);
  const img = new Image();
  img.onload = () => {
    const max = modoEditor ? 900 : 1200, esc = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*esc); c.height = Math.round(img.height*esc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>cb(b),"image/jpeg",modoEditor ? 0.72 : 0.8);
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert("Não foi possível ler essa imagem. Tente outro arquivo (JPG ou PNG)."); };
  img.src = url;
}

});

      if(a.foto){ foto = document.createElement("img"); foto.src=a.foto; foto.alt=a.nome; foto.className="foto"; }
      else{ foto = document.createElement("div"); foto.className="foto"; foto.textContent=(a.nome||"?").charAt(0).toUpperCase(); }

};
$("imagem").addEventListener("change", e=>{

});

    salvarEdicao(); desenhar(); $("dlNoticia").close();

  }
  exigirBanco();
  const imagem = imagemBlob ? await enviarImagem(imagemBlob) : imagemAtual;

}));
